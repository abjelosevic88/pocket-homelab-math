# Pocket Math (Go + SQLite) — sums with units, money and percentages, graphs, geometry, data, ready calculations and practice.
services:
  pocket-math:
    image: ghcr.io/abjelosevic88/pocket-homelab-math:latest
    container_name: pocket-math
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Pocket AI, and app links to Pocket Rooms, Home, Garage, Health, Money, Wealth, Tables, Notes, Files, Photos, Chat, Learn, Slides, Habits, Family and Alerts.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
