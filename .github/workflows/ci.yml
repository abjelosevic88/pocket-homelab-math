name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: The browser calculator answers like the Go one
        run: node scripts/calc-vectors.mjs
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-math ./cmd/pocket-math
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pmth DEMO_DATA=true AUTH_MODE=none ./pocket-math &
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/summary | grep -q '"practice_today"'
          curl -fsS http://localhost:8080/api/v1/notebooks | grep -q 'Monthly budget'
          curl -fsS 'http://localhost:8080/api/v1/search?q=budget' | grep -q 'Monthly budget'
          curl -fsS 'http://localhost:8080/api/v1/calculate?q=5%20km%20%2B%20300%20m' | grep -q '5.3 km'
          curl -fsS http://localhost:8080/api/v1/formulas | grep -q 'Paint for walls'
          curl -fsS http://localhost:8080/api/v1/practice | grep -q '"Mila"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-math:pr
